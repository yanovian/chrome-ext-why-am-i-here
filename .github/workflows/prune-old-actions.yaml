name: Prune old Actions

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune-old-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yanovian/prune-old-actions@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          days-ago: 30
